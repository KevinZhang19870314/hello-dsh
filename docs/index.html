<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <title>hello-dsh · 聊天（在线演示）</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310a37f'/%3E%3Cpath d='M8 12h16M8 17h11M8 22h7' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <button class="new-chat" id="new-chat" type="button">
            <span class="new-chat-icon" aria-hidden="true">＋</span>
            <span>新建对话</span>
          </button>
        </div>

        <nav class="conversation-list" id="conversation-list" aria-label="对话列表"></nav>

        <div class="sidebar-foot">
          <div class="mode" id="mode-badge" title="回复来源">正在检测…</div>
          <button class="ghost danger" id="clear-all" type="button">清空全部对话</button>
        </div>
      </aside>

      <div class="scrim" id="scrim" hidden></div>

      <main class="chat">
        <header class="chat-head">
          <button class="icon-btn only-mobile" id="toggle-sidebar" type="button" aria-label="打开对话列表">☰</button>
          <div class="chat-title" id="chat-title">新对话</div>
          <input class="title-input" id="title-input" type="text" hidden maxlength="60" aria-label="对话标题" />
          <div class="chat-actions">
            <button class="icon-btn" id="rename-chat" type="button" title="重命名当前对话" aria-label="重命名当前对话">✎</button>
            <button class="icon-btn danger" id="delete-chat" type="button" title="删除当前对话" aria-label="删除当前对话">🗑</button>
          </div>
        </header>

        <section class="messages" id="messages">
          <div class="messages-inner" id="messages-inner"></div>
        </section>

        <div class="welcome" id="welcome" hidden>
          <div class="welcome-logo" aria-hidden="true">✳</div>
          <h1>有什么可以帮你的？</h1>
          <p class="welcome-sub">输入消息开始聊天，左侧可以新建或删除对话。</p>
          <div class="suggestions" id="suggestions">
            <button type="button" data-prompt="用三句话介绍一下这个项目">用三句话介绍一下这个项目</button>
            <button type="button" data-prompt="帮我写一个 JavaScript 的快速排序函数">写一个快速排序函数</button>
            <button type="button" data-prompt="给我一个高效学习编程的建议清单">如何高效学习编程</button>
            <button type="button" data-prompt="用 Markdown 写一份周报模板">写一份周报模板</button>
          </div>
        </div>

        <form class="composer" id="composer" autocomplete="off">
          <div class="composer-inner">
            <textarea id="input" rows="1" placeholder="给助手发送消息…（Enter 发送，Shift + Enter 换行）" aria-label="消息输入框"></textarea>
            <button class="send" id="send" type="submit" disabled aria-label="发送">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 3l7 7h-4.5v11h-5V10H5z" fill="currentColor" />
              </svg>
            </button>
          </div>
          <p class="hint" id="hint"></p>
        </form>
      </main>
    </div>

    <script type="module" src="./boot.js"></script>
  </body>
</html>
